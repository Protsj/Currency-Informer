<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBU Currency Informer & Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div class="panel left-panel">
            <h2 class="panel-title">Exchange rates on <span id="current-date"></span></h2>
            <ul class="currency-list" id="currency-list">
                <li class="currency-item"></li>
            </ul>
        </div>

        <div class="panel right-panel">
            <h2 class="panel-title">Currency converter</h2>

            <div class="converter-row">
                <input type="number" id="amount-foreign" placeholder="Amount" min="0">
                <input list="currency-select" id="currency-input" placeholder="Select currency">
                <span class="arrow">&rarr;</span>
                <input type="number" id="amount-uah" placeholder="Hryvnias" readonly>
            </div>

            <div class="converter-row">
                <input type="number" id="amount-uah-input" placeholder="Hryvnias" min="0">
                <span class="arrow">&rarr;</span>
                <input list="currency-select" id="currency-input-target" placeholder="Select currency">
                <input type="number" id="amount-foreign-result" placeholder="Amount" readonly>
            </div>

            <hr class="divider">

            <div class="history-section">
                <h3 id="history-title" class="panel-title">Exchange rate for the week</h3>
                <div class="history-controls">
                    <div class="date-input-group">
                        <label for="start-date">From:</label>
                        <input type="date" id="start-date">
                    </div>
                    <div class="date-input-group">
                        <label for="end-date">To:</label>
                        <input type="date" id="end-date">
                    </div>
                    <button id="fetch-history-btn" disabled>Show History</button>
                </div>
                <div id="history-output">
                    <p class="placeholder-text">Select a currency from the list on the left</p>
                </div>
            </div>

            <datalist id="currency-select"></datalist>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>

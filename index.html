<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс валют та Конвертер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div class="panel left-panel">
            <h2 class="panel-title">Курс валют на <span id="current-date"></span></h2>
            <ul class="currency-list" id="currency-list">
                <li class="currency-item"></li>
            </ul>
        </div>

        <div class="panel right-panel">
            <h2 class="panel-title">Конвертер валют</h2>

            <div class="converter-row">
                <input type="number" id="amount-foreign" placeholder="Сума" min="0">
                <input list="currency-select" id="currency-input" placeholder="Виберіть валюту">
                <span class="arrow">&rarr;</span>
                <input type="number" id="amount-uah" placeholder="Гривні" readonly>
            </div>

            <div class="converter-row">
                <input type="number" id="amount-uah-input" placeholder="Гривні" min="0">
                <span class="arrow">&rarr;</span>
                <input list="currency-select" id="currency-input-target" placeholder="Виберіть валюту">
                <input type="number" id="amount-foreign-result" placeholder="Сума" readonly>
            </div>

            <datalist id="currency-select"></datalist>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
